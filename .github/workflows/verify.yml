name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows clean build
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Record tool versions
        run: |
          node --version
          npm --version
          git --version
      - name: Install locked backend tools
        run: npm ci
      - name: Install locked panel tools
        run: npm --prefix web ci
      - run: npm run typecheck
      - run: npm run build
      - name: Final tests after build
        run: npm test
      - run: npm run check
      - name: Reject stale or unexpected generated files
        run: node scripts/check-generated.mjs
      - run: git diff --check
