<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 1640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prompt-workflow-title prompt-workflow-desc" id="prompt-workflow-root">
<title id="prompt-workflow-title">Enhance Prompt: from user text to Copilot task</title>
<desc id="prompt-workflow-desc">Two connected stages show how user text, allowed context and rules become a rewrite request through Copilot, then how a reviewed result is sent to the attached session.</desc>
<defs>
      <style>#prompt-workflow-root { color-scheme: light; }
      #prompt-workflow-root { color: #171717; font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif; }
      #prompt-workflow-root .diagram-container { width:100%; overflow-x:auto; }
      #prompt-workflow-root text { font-family:ui-sans-serif, system-ui, 'Segoe UI', sans-serif; fill:#171717; }
      #prompt-workflow-root .body { font-size:12px; font-weight:400; }
      #prompt-workflow-root .node-name { font-size:16px; font-weight:600; }
      #prompt-workflow-root .group-title { font-size:14px; font-weight:600; }
      #prompt-workflow-root .diagram-title { font-size:40px; font-weight:600; letter-spacing:-1.2px; }
      #prompt-workflow-root .section-title { font-size:28px; font-weight:600; letter-spacing:-.6px; }
      #prompt-workflow-root .section-number { font-size:28px; font-weight:400; fill:#686868; }
      #prompt-workflow-root .kicker, #prompt-workflow-root .technical { font-family:ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size:12px; }
      #prompt-workflow-root .kicker { letter-spacing:1.4px; }
      #prompt-workflow-root .arrow-label { font-family:ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size:10px; fill:#686868; }
      #prompt-workflow-root .legend { font-size:10px; fill:#686868; }
      #prompt-workflow-root .separator { stroke:#d4d4d4; stroke-width:1; }
      #prompt-workflow-root .step, #prompt-workflow-root .input, #prompt-workflow-root .artifact, #prompt-workflow-root .optional-box { fill:#fafafa; stroke:#d4d4d4; stroke-width:1.3; }
      #prompt-workflow-root .input { stroke:#686868; }
      #prompt-workflow-root .artifact { fill:#f5f5f5; }
      #prompt-workflow-root .optional-box { stroke:#686868; stroke-dasharray:5 4; }
      #prompt-workflow-root .payload { fill:#f5f5f5; stroke:#686868; stroke-width:1.3; }
      #prompt-workflow-root .focal { fill:#ededed; stroke:#171717; stroke-width:1.5; }
      #prompt-workflow-root .connector { fill:none; stroke:#686868; stroke-width:1.5; }
      #prompt-workflow-root .optional { stroke-dasharray:5 4; }
      #prompt-workflow-root a { color:inherit; }
      @media print {
#prompt-workflow-root .diagram-container { overflow:visible; }
}</style><marker id="prompt-workflow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#686868"/></marker></defs>
<rect width="960" height="1640" fill="#fafafa"/>
<text x="40" y="52" class="kicker" >ENHANCE PROMPT / GITHUB COPILOT</text>
<text x="40" y="108" class="diagram-title" >From rough request to an actionable prompt</text>
<text x="40" y="144" class="body" >A Copilot model creates the prompt. The attached session receives it and carries out the task.</text>
<line x1="40" x2="920" y1="180" y2="180" class="separator"/><text x="40" y="224" class="section-number" >01</text><text x="84" y="224" class="section-title" >Build the rewrite request</text><text x="84" y="252" class="body" >In the native canvas, click Enhance after choosing the input, context and model.</text>
<path d="M 162 400 V 448" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 462 400 V 448" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 780 400 V 448" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 312 608 V 664" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 584 728 H 640" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<g><rect x="586" y="696" width="52" height="20" fill="#fafafa"/><text x="612" y="710" class="arrow-label" text-anchor="middle">RESULT</text></g>
<g class="node"><rect x="40" y="284" width="244" height="116" rx="6" class="input"/><text x="60" y="316" class="node-name" >Your request</text><text x="60" y="340" class="body" >Rough text + explicit attachments</text><text x="60" y="358" class="body" >Text excerpts, images and paths</text><text x="60" y="376" class="body" >Preview context; exclude items</text></g>
<g class="node"><rect x="320" y="284" width="284" height="116" rx="6" class="step"/><text x="340" y="316" class="node-name" >Allowed project context</text><text x="340" y="340" class="body" >Context levels, with privacy switches</text><text x="340" y="358" class="body" >Safe paths; recognized secrets masked</text><text x="340" y="376" class="body" >Optional AI selection and research</text></g>
<g class="node"><rect x="640" y="284" width="280" height="116" rx="6" class="step"/><text x="660" y="316" class="node-name" >How to rewrite</text><text x="660" y="340" class="body" >Global + project rules; custom text</text><text x="660" y="358" class="body" >Style or structure; English output</text><text x="660" y="376" class="body" >Optional Copilot-specific guidance</text></g>
<g class="node"><rect x="40" y="448" width="880" height="160" rx="6" class="payload"/>
  <text x="60" y="480" class="node-name" >One enhancement request, two parts</text>
  <line x1="472" y1="504" x2="472" y2="588" class="separator"/>
  <text x="60" y="520" class="group-title" >System instructions</text>
  <text x="60" y="544" class="body" >Preserve intent; use grounded details.</text><text x="60" y="564" class="body" >Apply rules and shape; write in English.</text><text x="60" y="584" class="body" >Return only the final prompt.</text>
  <text x="496" y="520" class="group-title" >User payload + supported images</text>
  <text x="496" y="544" class="technical" >&lt;project_context&gt; allowed context &lt;/project_context&gt;</text><text x="496" y="564" class="technical" >&lt;request&gt; original text &lt;/request&gt;</text>
  <text x="496" y="584" class="body" >Attached text and file paths; image input where supported.</text>
</g>
<g class="node"><rect x="40" y="664" width="544" height="128" rx="6" class="focal"/><text x="60" y="696" class="node-name" >Your selected Copilot model</text><text x="60" y="720" class="body" >Claude, GPT and other models available through Copilot</text><text x="60" y="738" class="body" >Copilot helper: desktop SDK/runtime, isolated, no tools.</text><text x="60" y="756" class="body" >Copilot verifies the account and model before sending.</text><text x="60" y="774" class="body" >Copilot runs stay on Copilot; no npm or runtime download.</text></g>
<g class="node"><rect x="640" y="664" width="280" height="128" rx="6" class="artifact"/><text x="660" y="696" class="node-name" >Enhanced task prompt</text><text x="660" y="720" class="body" >Remove common model wrappers.</text><text x="660" y="738" class="body" >Keep attached-file paths.</text><text x="660" y="756" class="body" >Return the result to the canvas.</text><text x="660" y="774" class="body" >Save prompt history if enabled.</text></g>
<text x="40" y="832" class="body" >Selector failure → keep heuristic file selection. Fatal validation/model failure or cancellation → no send.</text>
<text x="40" y="856" class="body" >Selection, research and fallback all use Copilot models and can add usage.</text>
<line x1="40" x2="920" y1="892" y2="892" class="separator"/><text x="40" y="936" class="section-number" >02</text><text x="84" y="936" class="section-title" >Review, then hand the prompt to Copilot</text><text x="84" y="964" class="body" >A successful rewrite is still text. Sending is a separate action.</text>
<path d="M 136 1096 V 1152" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 320 1096 V 1120 Q 320 1128 328 1128 H 432 Q 440 1128 440 1136 V 1152" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 720 1096 V 1120 Q 720 1128 712 1128 H 608 Q 600 1128 600 1136 V 1152" class="connector optional" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 680 1220 H 720" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<path d="M 520 1288 V 1352" class="connector" marker-end="url(#prompt-workflow-arrow)"/>
<g><rect x="154" y="1114" width="100" height="20" fill="#fafafa"/><text x="204" y="1128" class="arrow-label" text-anchor="middle">COPY / SAVE</text></g>
<g><rect x="336" y="1096" width="100" height="20" fill="#fafafa"/><text x="386" y="1110" class="arrow-label" text-anchor="middle">CLICK SEND</text></g>
<g><rect x="600" y="1096" width="104" height="20" fill="#fafafa"/><text x="652" y="1110" class="arrow-label" text-anchor="middle">CHECKS PASS</text></g>
<g><rect x="678" y="1188" width="44" height="20" fill="#fafafa"/><text x="700" y="1202" class="arrow-label" text-anchor="middle">HOLD</text></g>
<g><rect x="548" y="1310" width="52" height="20" fill="#fafafa"/><text x="574" y="1324" class="arrow-label" text-anchor="middle">IDLE</text></g>
<g class="node"><rect x="40" y="992" width="360" height="104" rx="6" class="input"/><text x="60" y="1024" class="node-name" >Review and edit the result</text><text x="60" y="1048" class="body" >Read the generated task prompt.</text><text x="60" y="1066" class="body" >Make any corrections before Send.</text><text x="60" y="1084" class="body" >Normal Send uses this reviewed text.</text></g>
<g class="node"><rect x="520" y="992" width="400" height="104" rx="6" class="optional-box"/><text x="540" y="1024" class="node-name" >Optional: send right after enhancing</text><text x="540" y="1048" class="body" >Off by default; requires explicit opt-in.</text><text x="540" y="1066" class="body" >Recheck unchanged input, project and target.</text><text x="540" y="1084" class="body" >Cancel, closing or switching it off stops the send.</text></g>
<g class="node"><rect x="40" y="1152" width="240" height="96" rx="6" class="artifact"/><text x="60" y="1184" class="node-name" >Copy or download</text><text x="60" y="1208" class="body" >Keep the prompt for manual use.</text><text x="60" y="1226" class="body" >No Copilot message is sent.</text></g>
<g class="node"><rect x="360" y="1152" width="320" height="136" rx="6" class="step"/><text x="380" y="1184" class="node-name" >Check the attached session</text><text x="380" y="1208" class="body" >Send permission must be on.</text><text x="380" y="1226" class="body" >Exact session; idle; no permission</text><text x="380" y="1244" class="body" >request or queued work pending.</text><text x="380" y="1262" class="body" >Unknown or busy state refuses Send.</text></g>
<g class="node"><rect x="720" y="1172" width="200" height="96" rx="6" class="artifact"/><text x="740" y="1204" class="node-name" >Keep for review</text><text x="740" y="1228" class="body" >No message submitted.</text><text x="740" y="1246" class="body" >Explain the hold reason.</text></g>
<g class="node"><rect x="360" y="1352" width="560" height="104" rx="6" class="focal"/><text x="380" y="1384" class="node-name" >Enqueue a new message for Copilot</text><text x="380" y="1408" class="body" >Submit the reviewed text or the opted-in run result.</text><text x="380" y="1426" class="body" >Copilot adds its own context and processes the task.</text><text x="380" y="1444" class="body" >Its own tools and permissions govern the work that follows.</text></g>
<text x="40" y="1380" class="group-title" >State stays local</text>
<text x="40" y="1404" class="body" >Profiles, preferences, rules, history.</text><text x="40" y="1424" class="body" >Session-scoped drafts and results.</text><text x="40" y="1444" class="body" >Local usage accounting records.</text>
<text x="40" y="1496" class="body" >The idle check and send are not atomic: if work starts between them, the new message waits in the queue.</text>
<text x="40" y="1532" class="body" >Recognized secrets in automatic context are masked. Typed text and attachments stay as supplied.</text>
<line x1="40" y1="1572" x2="920" y2="1572" class="separator"/>
<path d="M 40 1604 H 72" class="connector" marker-end="url(#prompt-workflow-arrow)"/><text x="88" y="1608" class="legend" >Data or action flow</text>
<path d="M 288 1604 H 320" class="connector optional" marker-end="url(#prompt-workflow-arrow)"/><text x="336" y="1608" class="legend" >Optional path</text>
<text x="572" y="1608" class="legend" >Full branches and code references: docs/prompt-workflow.md</text>
</svg>
